name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails if line, branch, function or statement coverage drops below 80%.
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: node-bundle
          path: |
            dist/
            migrations/
            package.json
            package-lock.json
          retention-days: 14
